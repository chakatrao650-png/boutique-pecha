<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #000; color: #0f0;
           font-family: "Courier New", monospace; display: flex;
           justify-content: center; align-items: flex-start; padding: 24px 14px; }
    #matrix { position: fixed; inset: 0; z-index: -1; }
    .carte { width: 100%; max-width: 460px; background: rgba(0,0,0,.84);
             border: 2px solid #0f0; border-radius: 14px; padding: 20px;
             text-align: center; box-shadow: 0 0 18px #0f0; }
    h1 { color: #f00; font-size: 2.4rem; margin: 0 0 6px; letter-spacing: 4px;
         text-shadow: 0 0 12px #f00; animation: glitch 2.5s infinite; }
    @keyframes glitch {
      0%, 90%, 100% { color: #f00; text-shadow: 0 0 12px #f00; transform: none; }
      92% { color: #0f0; text-shadow: 0 0 12px #0f0; transform: translateX(4px); }
      96% { color: #0f0; text-shadow: 0 0 12px #0f0; transform: translateX(-4px); }
    }
    h2 { color: #f00; text-shadow: 0 0 8px #f00; font-size: 1.2rem;
         margin: 24px 0 10px; letter-spacing: 2px; }
    p { margin: 8px 0; }
    .produit { border: 2px solid #0f0; border-radius: 12px; padding: 14px; margin: 12px 0;
               text-align: left; box-shadow: 0 0 8px rgba(0,255,0,.4); }
    .produit h3 { margin: 0 0 4px; color: #fff; }
    .produit p { margin: 0 0 8px; color: #0c0; font-size: .9rem; }
    .prix { color: #ff0; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }
    .btn { display: block; text-decoration: none; padding: 12px 10px; border-radius: 10px;
           border: 2px solid #0f0; background: #000; color: #0f0; text-align: center;
           transition: .2s; }
    .btn:hover, .btn:active { background: #0f0; color: #000; box-shadow: 0 0 12px #0f0; }
    .gros { margin: 20px 0 6px; font-size: 1.05rem; border-color: #f00; color: #f00; }
    .gros:hover, .gros:active { background: #f00; color: #000; box-shadow: 0 0 12px #f00; }
    #demo { display: none; }
    video { width: 100%; border: 2px solid #0f0; border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,255,0,.5); background: #000; }
    .infos { line-height: 1.9; }
    #pied { color: #0a0; font-size: .8rem; margin-top: 18px; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <main class="carte">
    <h1 id="nom"></h1>
    <p id="slogan"></p>
    <p id="description"></p>
    <section id="demo">
      <h2>// DÉMO</h2>
      <video id="video" controls playsinline preload="metadata"></video>
    </section>
    <h2>// PRODUITS</h2>
    <div id="liste"></div>
    <a class="btn gros" id="contact" target="_blank" rel="noopener">💬 Nous écrire sur WhatsApp</a>
    <h2>// INFOS</h2>
    <div class="infos"><div id="adresse"></div><div id="horaires"></div></div>
    <p id="pied"></p>
  </main>

  <script>
    const CONFIG = {
      nom: "PECHA Scripts",
      slogan: "Bannières et scripts Termux personnalisés",
      description: "Ta bannière animée avec ton pseudo, prête en quelques minutes. Paiement par Orange Money, Moov Money ou Wave.",
      whatsapp: "22377654726",
      adresse: "Mali - commande et livraison par WhatsApp",
      horaires: "Réponse rapide sur WhatsApp, tous les jours",
      couleur: "#1e8449",
      devise: "FCFA",
      createur: "",
      produits: [
        { nom: "Bannière animée personnalisée", prix: 500, description: "Ton pseudo, 5 thèmes de couleurs, mode d'emploi fourni" },
        { nom: "Pack bannière + menu Termux", prix: 1000, description: "Bannière, menu de lancement et jeu inclus" },
        { nom: "Aide à l'installation", prix: 300, description: "Je t'aide à tout installer sur ton téléphone" }
      ]
    };

    const $ = id => document.getElementById(id);
    const lien = msg => "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(msg);

    document.title = CONFIG.nom;
    $("nom").textContent = CONFIG.nom;
    $("slogan").textContent = CONFIG.slogan;
    $("description").textContent = CONFIG.description;
    $("adresse").textContent = "📍 " + CONFIG.adresse;
    $("horaires").textContent = "🕒 " + CONFIG.horaires;
    $("contact").href = lien("Bonjour " + CONFIG.nom + ", j'ai une question.");
    $("pied").textContent = CONFIG.createur ? "Page créée par " + CONFIG.createur : "";

    const v = $("video");
    v.addEventListener("loadedmetadata", () => { $("demo").style.display = "block"; });
    v.src = CONFIG.video || "demo.mp4";

    CONFIG.produits.forEach(p => {
      const carte = document.createElement("div");
      carte.className = "produit";
      const h = document.createElement("h3");
      h.textContent = p.nom;
      const d = document.createElement("p");
      d.textContent = p.description || "";
      const prix = document.createElement("div");
      prix.className = "prix";
      prix.textContent = p.prix.toLocaleString("fr-FR") + " " + CONFIG.devise;
      const a = document.createElement("a");
      a.className = "btn";
      a.textContent = "Commander sur WhatsApp";
      a.target = "_blank";
      a.rel = "noopener";
      a.href = lien("Bonjour " + CONFIG.nom + ", je voudrais commander : " + p.nom);
      carte.append(h, d, prix, a);
      $("liste").appendChild(carte);
    });

    // Pluie de caractères en arrière-plan
    const canvas = $("matrix");
    const ctx = canvas.getContext("2d");
    const CARS = "01ABCDEF$#@%&";
    let gouttes = [];
    function initMatrix() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      gouttes = Array(Math.floor(canvas.width / 16)).fill(0)
        .map(() => Math.floor(Math.random() * -50));
    }
    function dessiner() {
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = "16px monospace";
      gouttes.forEach((y, i) => {
        ctx.fillStyle = Math.random() < 0.1 ? "#f00" : "#0f0";
        ctx.fillText(CARS[Math.floor(Math.random() * CARS.length)], i * 16, y * 16);
        if (y * 16 > canvas.height && Math.random() > 0.975) gouttes[i] = 0;
        else gouttes[i] = y + 1;
      });
    }
    window.addEventListener("resize", initMatrix);
    initMatrix();
    setInterval(dessiner, 50);
  </script>
</body>
</html>
